<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>无人机智能巡检与目标检测系统</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <script>
        // 入口页：按登录状态跳转
        (function () {
            var target = "login.html";
            try {
                if (localStorage.getItem("uav.session")) {
                    target = "statistics.html";
                }
            } catch (e) { /* 忽略 */ }
            location.replace(target);
        })();
    </script>
</head>
<body>
    <div class="empty" style="height:100vh">
        <div class="spinner spinner--dark"></div>
        <div class="empty__title">正在进入系统…</div>
    </div>
</body>
</html>
