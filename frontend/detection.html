<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>目标检测 · 无人机智能巡检与目标检测系统</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <div class="main">
            <header class="topbar" id="topbar"></header>

            <main class="content">
                <div class="page-head">
                    <div>
                        <div class="page-head__title" id="pageTitle">图片检测</div>
                        <div class="page-head__sub" id="pageSub">上传航拍图片，自动识别并标注目标</div>
                    </div>
                    <div class="page-head__actions">
                        <div class="segmented" id="modeSwitch">
                            <button class="segmented__item is-active" type="button" data-mode="image">
                                <i data-lucide="image"></i>图片检测
                            </button>
                            <button class="segmented__item" type="button" data-mode="video">
                                <i data-lucide="video"></i>视频检测
                            </button>
                        </div>
                    </div>
                </div>

                <section class="grid-2">
                    <!-- 上传 -->
                    <div class="card">
                        <div class="card__head">
                            <div>
                                <div class="card__title">选择文件</div>
                                <div class="card__sub" id="uploadSub">支持 JPG / JPEG / PNG，最大 500 MB</div>
                            </div>
                        </div>
                        <div class="card__body">
                            <div class="dropzone" id="dropzone">
                                <div class="dropzone__icon"><i data-lucide="upload-cloud"></i></div>
                                <div class="dropzone__title">点击选择文件，或将文件拖拽到此处</div>
                                <div class="dropzone__hint" id="dropHint">支持 JPG / JPEG / PNG，最大 500 MB</div>
                            </div>
                            <input type="file" id="fileInput" class="hidden">

                            <div class="row row--between mt-16 hidden" id="fileRow">
                                <div class="row" style="min-width:0">
                                    <span class="badge badge--image" id="fileTypeBadge">
                                        <i data-lucide="file"></i>文件
                                    </span>
                                    <span class="name" id="fileName" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
                                    <span class="muted" id="fileSize"></span>
                                </div>
                                <button class="btn btn--sm" type="button" id="clearBtn">
                                    <i data-lucide="x"></i>移除
                                </button>
                            </div>

                            <div class="mt-16">
                                <button class="btn btn--primary btn--lg btn--block" type="button" id="detectBtn" disabled>
                                    <i data-lucide="scan-search"></i>开始检测
                                </button>
                            </div>

                            <div class="hidden mt-16" id="progressBox">
                                <div class="row row--between mb-16" style="margin-bottom:8px">
                                    <span class="loading" id="progressText">
                                        <span class="spinner spinner--dark"></span>正在推理…
                                    </span>
                                    <span class="muted mono" id="progressTime">0s</span>
                                </div>
                                <div class="progress"><div class="progress__bar" id="progressBar"></div></div>
                            </div>
                        </div>
                    </div>

                    <!-- 预览 -->
                    <div class="card">
                        <div class="card__head">
                            <div>
                                <div class="card__title">结果预览</div>
                                <div class="card__sub" id="previewSub">检测完成后在此查看标注结果</div>
                            </div>
                            <div class="card__tools">
                                <button class="btn btn--sm" type="button" id="downloadBtn" disabled>
                                    <i data-lucide="download"></i>下载结果
                                </button>
                            </div>
                        </div>
                        <div class="card__body">
                            <div class="preview" id="previewBox">
                                <div class="preview__placeholder" id="previewPlaceholder">
                                    <i data-lucide="image"></i>
                                    <span>暂无预览内容</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 结果统计 -->
                <section class="grid-1">
                    <div class="card">
                        <div class="card__head">
                            <div>
                                <div class="card__title">检测结果统计</div>
                                <div class="card__sub" id="resultSub">完成一次检测后展示统计信息</div>
                            </div>
                            <div class="card__tools">
                                <span class="badge hidden" id="recordBadge"></span>
                            </div>
                        </div>
                        <div class="card__body">
                            <div class="metrics" id="metrics">
                                <div class="empty" style="grid-column:1/-1">
                                    <i data-lucide="scan-search"></i>
                                    <div class="empty__title">暂无检测结果</div>
                                    <div class="empty__hint">上传文件并开始检测后，这里会显示目标数量与类别分布</div>
                                </div>
                            </div>

                            <div class="hidden mt-24" id="classPanel">
                                <div class="row row--between" style="margin-bottom:14px">
                                    <div class="card__title" style="font-size:13.5px">类别分布</div>
                                    <span class="muted" id="classMeta"></span>
                                </div>
                                <div class="classbar" id="classBars"></div>
                            </div>

                            <div class="hidden mt-24" id="detectionPanel">
                                <div class="row row--between" style="margin-bottom:14px">
                                    <div class="card__title" style="font-size:13.5px">检测目标明细</div>
                                    <span class="muted" id="detectionMeta"></span>
                                </div>
                                <div class="table-wrap" style="max-height:340px;overflow:auto;border:1px solid var(--line-2);border-radius:8px">
                                    <table class="table">
                                        <thead>
                                            <tr>
                                                <th>#</th>
                                                <th>类别</th>
                                                <th>置信度</th>
                                                <th>坐标 (x1, y1, x2, y2)</th>
                                            </tr>
                                        </thead>
                                        <tbody id="detectionBody"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="toastRoot" class="toast-root"></div>

    <script src="vendor/lucide.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/detection.js"></script>
</body>
</html>
